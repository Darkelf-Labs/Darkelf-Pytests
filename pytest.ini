[pytest]
minversion = 8.0

testpaths =
    tests

python_files =
    test_*.py

python_classes =
    Test*

python_functions =
    test_*

addopts =
    -ra
    --strict-markers
    --tb=short
    --color=yes

markers =
    cocoa: Tests for Darkelf Cocoa
    shadow: Tests for Darkelf Shadow
    secureaudit: Tests for Darkelf SecureAudit
    dependencyguardian: Tests for Darkelf Dependency Guardian
    integration: Integration tests
    regression: Regression tests
    security: Security regression tests
    performance: Performance regression tests
    slow: Slow-running tests

filterwarnings =
    ignore::DeprecationWarning
