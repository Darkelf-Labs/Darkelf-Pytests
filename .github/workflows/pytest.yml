name: Pytest

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} • ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"

    steps:
      ####################################################################
      # Checkout
      ####################################################################

      - name: Checkout Darkelf-Pytests
        uses: actions/checkout@v5

      ####################################################################
      # Python
      ####################################################################

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      ####################################################################
      # Install test framework
      ####################################################################

      - name: Install Darkelf-Pytests
        run: |
          pip install -e .
          pip install pytest pytest-cov ruff bandit

      ####################################################################
      # Checkout ecosystem
      ####################################################################

      - name: Checkout Darkelf WebKit Audit
        uses: actions/checkout@v5
        with:
          repository: Darkelf-Labs/Darkelf-Webkit-Audit
          path: external/Darkelf-Webkit-Audit

      - name: Checkout Dependency Guardian
        uses: actions/checkout@v5
        with:
          repository: Darkelf-Labs/Darkelf-Dependency-Guardian
          path: external/Darkelf-Dependency-Guardian

      - name: Checkout Darkelf Shadow CE
        uses: actions/checkout@v5
        with:
          repository: Darkelf-Labs/Darkelf-Shadow-CE
          path: external/Darkelf-Shadow-CE

      - name: Checkout Darkelf CLI Browser
        uses: actions/checkout@v5
        with:
          repository: Darkelf-Labs/Darkelf-CLI-Browser
          path: external/Darkelf-CLI-Browser

      ####################################################################
      # Linux Qt Runtime
      ####################################################################

      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libopengl0 \
            libglu1-mesa \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xinput0 \
            libxrender1 \
            libxi6 \
            libsm6 \
            libice6

      ####################################################################
      # Install ecosystem packages
      ####################################################################

      - name: Install SecureAudit
        run: pip install -e external/Darkelf-Webkit-Audit

      - name: Install Dependency Guardian
        run: pip install -e external/Darkelf-Dependency-Guardian

      - name: Install Shadow CE
        run: pip install -e external/Darkelf-Shadow-CE

      ####################################################################
      # Verify installation
      ####################################################################

      - name: Verify installed tools
        shell: bash
        run: |
          python --version
          pip list

          which darkelf-secureaudit || true
          which guardian || true
          which darkelf-shadow || true

          darkelf-secureaudit --help || true
          guardian --help || true

      ####################################################################
      # Ruff
      ####################################################################

      - name: Ruff Lint
        run: |
          ruff check .
          ruff check external/Darkelf-Webkit-Audit
          ruff check external/Darkelf-Dependency-Guardian
          ruff check external/Darkelf-Shadow-CE

      - name: Ruff Format Check
        run: |
          ruff format --check .
          ruff format --check external/Darkelf-Webkit-Audit
          ruff format --check external/Darkelf-Dependency-Guardian
          ruff format --check external/Darkelf-Shadow-CE

      ####################################################################
      # Bandit
      ####################################################################

      - name: Bandit Security Scan
        run: |
          bandit -r . -x tests,.venv,venv,build,dist,external -ll
          bandit -r external/Darkelf-Webkit-Audit -ll
          bandit -r external/Darkelf-Dependency-Guardian -ll
          bandit -r external/Darkelf-Shadow-CE -ll

      ####################################################################
      # Pytest
      ####################################################################

      - name: Run Pytest
        shell: bash
        run: |
          pytest \
            --cov=tests \
            --cov=external/Darkelf-Webkit-Audit/darkelf_secureaudit \
            --cov=external/Darkelf-Dependency-Guardian/core \
            --cov=external/Darkelf-Shadow-CE/shadow \
            --cov-report=term-missing \
            --cov-report=xml

      ####################################################################
      # Coverage
      ####################################################################

      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml

      ####################################################################
      # Pytest Cache
      ####################################################################

      - name: Upload Pytest Cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-cache-${{ matrix.os }}-${{ matrix.python-version }}
          path: .pytest_cache
          if-no-files-found: ignore
