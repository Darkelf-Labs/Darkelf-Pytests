 [project]
 name = "darkelf-pytests"
 version = "1.0.0"
 description = "Central pytest suite for the Darkelf Labs ecosystem."
 readme = "README.md"
 requires-python = ">=3.11"
 license = "LGPL-3.0-or-later"
 authors = [
     { name = "Darkelf Labs" }
 ]
 keywords = [
     "pytest",
     "testing",
     "security",
     "webkit",
     "pyobjc",
     "qt",
     "darkelf",
     "browser",
     "privacy",
 ]
 classifiers = [
     "Development Status :: 4 - Beta",
     "Framework :: Pytest",
     "Intended Audience :: Developers",
     "Operating System :: OS Independent",
     "Programming Language :: Python :: 3",
     "Programming Language :: Python :: 3.11",
     "Programming Language :: Python :: 3.12",
     "Topic :: Software Development :: Testing",
     "Topic :: Security",
 ]

 dependencies = [
     "pytest>=8.3",
     "pytest-cov>=6.0",
     "coverage>=7.8",
 ]

 [project.optional-dependencies]
 dev = [
     "ruff>=0.12",
     "bandit>=1.8",
 ]

 [tool.pytest.ini_options]
 minversion = "8.0"
 testpaths = [
     "tests",
 ]
 python_files = [
     "test_*.py",
 ]
 python_classes = [
     "Test*",
 ]
 python_functions = [
     "test_*",
 ]
 addopts = [
     "-ra",
     "--strict-markers",
     "--tb=short",
 ]
 markers = [
     "cocoa: Darkelf Cocoa tests",
     "shadow: Darkelf Shadow tests",
     "secureaudit: Darkelf SecureAudit tests",
     "dependencyguardian: Darkelf Dependency Guardian tests",
     "integration: Integration tests",
     "regression: Regression tests",
     "slow: Slow tests",
 ]

 [tool.coverage.run]
 branch = true
 concurrency = ["thread"]
 source = [
     "tests",
 ]

 [tool.coverage.report]
 show_missing = true
 skip_covered = false
 precision = 2

 [tool.ruff]
 line-length = 100
 target-version = "py311"

 [tool.ruff.lint]
 select = [
     "E",
     "F",
     "I",
     "B",
 ]

 [build-system]
 requires = [
     "setuptools>=69",
     "wheel",
 ]
 build-backend = "setuptools.build_meta"
